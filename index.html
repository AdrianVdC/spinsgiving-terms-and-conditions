<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        async function geoRedirect() {
            try {
                // Fetch the user's location details based on their IP address
                const response = await fetch('https://ipapi.co');
                const data = await response.json();
                
                // Extract the US State code (e.g., 'NJ', 'NY', 'CA')
                const state = data.region_code; 

                // Route based on the user's state
                if (state === 'NJ') {
                    window.location.href = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_CA_0095.pdf";
                } else {
                    // Fallback link for all other states (and other countries)
                    window.location.href = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_15487.pdf";
                }
            } catch (error) {
                // Safety net: if the location service fails, send everyone to the default link
                window.location.href = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_15487.pdf";
            }
        }
        // Run the function immediately when the page loads
        window.onload = geoRedirect;
    </script>
</head>
<body>
    <p>Loading your document based on your location...</p>
</body>
</html>
