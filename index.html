<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        async function geoRedirect() {
            const defaultLink = "https://fanatics.com";
            const njLink = "https://fanatics.com";

            try {
                // FIX: Added /json/ to ensure structured data is returned
                const response = await fetch('https://ipapi.co/json/');
                
                if (!response.ok) throw new Error("API response error");
                
                const data = await response.json();
                const state = data.region_code; // Expected: 'NJ'

                // Log to screen for debugging purposes
                document.getElementById("status").innerText = "Detected State: " + (state || "Unknown");

                if (state === 'NJ') {
                    window.location.href = njLink;
                } else {
                    window.location.href = defaultLink;
                }
            } catch (error) {
                // If an ad-blocker stops the script, send to default link
                document.getElementById("status").innerText = "Location blocked. Loading default document...";
                window.location.href = defaultLink;
            }
        }
        window.onload = geoRedirect;
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <p id="status">Verifying your location to open the correct document...</p>
</body>
</html>
