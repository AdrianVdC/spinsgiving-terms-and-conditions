<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting…</title>
</head>
<body>
  <p id="msg">Checking your location…</p>

  <script>
    const NJ_URL    = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_15487.pdf";
    const OTHER_URL = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_CA_0095.pdf";

    function showMessage(text) {
      document.title = "Not available";
      document.getElementById("msg").textContent = text;
    }

    fetch("https://ipapi.co/json/")
      .then(r => {
        if (!r.ok) throw new Error("Lookup failed");
        return r.json();
      })
      .then(data => {
        const country = data.country_code;
        const region  = data.region_code;

        if (country === "CA") {
          showMessage("This promotion is not available in Canada.");
        } else if (country === "US" && region === "NJ") {
          window.location.replace(NJ_URL);
        } else if (country === "US") {
          window.location.replace(OTHER_URL);
        } else {
          showMessage("This promotion is not available in your location.");
        }
      })
      .catch(() => {
        showMessage("We couldn't verify your location. Please try again.");
      });
  </script>
</body>
</html>
