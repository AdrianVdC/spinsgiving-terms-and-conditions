<!DOCTYPE html>
<html>
<head>
    <title>Redirecting...</title>
    <script>
        async function geoRedirect() {
            // Your exact links are now properly hardcoded below:
            const njLink = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_CA_0095.pdf";
            const defaultLink = "https://sportsbook.fanatics.com/promo-terms/2026/CAS_15487.pdf";

            try {
                // Fetching location data from ipinfo.io
                const response = await fetch('https://ipinfo.io');
                
                if (!response.ok) throw new Error("API response error");
                
                const data = await response.json();
                const state = data.region; // Returns full state name like "New Jersey"

                const stateLower = state ? state.toLowerCase() : "";

                // Route to NJ link if New Jersey is detected
                if (stateLower === "new jersey" || stateLower === "nj") {
                    window.location.href = njLink;
                } else {
                    window.location.href = defaultLink;
                }
            } catch (error) {
                // Fallback to the default link if an ad-blocker stops the script
                window.location.href = defaultLink;
            }
        }
        window.onload = geoRedirect;
    </script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; margin-top: 50px;">
    <p>Verifying your location to open the correct document...</p>
</body>
</html>
